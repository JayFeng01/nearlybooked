<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NearlyBooked — League City Party Vendors</title>
<meta name="description" content="Find bounce houses, photographers, entertainers, bakeries and more for your party in League City, TX.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#fdfaf6; --card:#ffffff; --ink:#231f20; --sub:#6b6560;
    --accent:#e85d3d; --accent2:#2c7a7b; --line:#eee3d8;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#171412; --card:#221e1b; --ink:#f3ede6; --sub:#b7ada2; --line:#332c26; }
  }
  :root[data-theme="dark"]{ --bg:#171412; --card:#221e1b; --ink:#f3ede6; --sub:#b7ada2; --line:#332c26; }
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  *{box-sizing:border-box;}
  body{height:100%; margin:0; background:var(--bg); color:var(--ink); font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
  header{position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); border-bottom:1px solid var(--line); padding:18px 20px 14px; z-index:10;}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .brand h1{font-size:1.5rem; margin:0; letter-spacing:-0.02em;}
  .brand h1 span{color:var(--accent);}
  .tagline{color:var(--sub); font-size:0.85rem; margin:2px 0 14px;}
  .btn{padding:9px 16px; border:none; border-radius:999px; background:var(--accent2); color:#fff; font-size:0.85rem; font-weight:600; cursor:pointer;}
  .btn.ghost{background:transparent; color:var(--sub); border:1px solid var(--line);}
  .filters{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;}
  .chip{flex:0 0 auto; padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:0.85rem; cursor:pointer; white-space:nowrap;}
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  main{max-width:900px; margin:0 auto; padding:20px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:8px;}
  .cat{font-size:0.7rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent2); font-weight:600;}
  .name{font-size:1.05rem; font-weight:600; margin:0;}
  .area,.rating{color:var(--sub); font-size:0.85rem;}
  .photo{width:100%; height:150px; object-fit:cover; border-radius:10px; background:var(--line);}
  .site{color:var(--accent2); font-size:0.85rem; word-break:break-all;}
  .hint{font-size:0.75rem; color:var(--sub); margin:-4px 0 8px;}
  .mini{margin-top:6px; align-self:flex-start; padding:8px 14px; border-radius:8px; background:var(--accent); color:#fff; text-decoration:none; font-size:0.85rem; font-weight:600; border:none; cursor:pointer;}
  .empty{text-align:center; color:var(--sub); padding:40px 0;}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:20px;}
  .panel h2{margin:0 0 10px; font-size:1.05rem;}
  input,select{width:100%; padding:10px; margin-bottom:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:0.9rem;}
  .status{font-size:0.8rem; color:var(--accent2); min-height:1.2em;}
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--card); border-radius:14px; padding:22px; width:100%; max-width:360px;}
  .modal h2{margin:0 0 10px; font-size:1.1rem;}
  .switch{font-size:0.8rem; color:var(--accent2); cursor:pointer; text-align:center; margin-top:4px;}
  footer{text-align:center; color:var(--sub); font-size:0.8rem; padding:30px 20px;}
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="brand"><h1>Nearly<span>Booked</span></h1></div>
    <div id="authArea"><button class="btn" id="openAuth">Vendor Log In</button></div>
  </div>
  <p class="tagline">Find local party vendors in League City — all in one place.</p>
  <div class="filters" id="filters"></div>
</header>
<main>
  <div id="myPanel"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" style="display:none;">No vendors in this category yet.</p>
</main>
<footer>NearlyBooked · League City, TX</footer>

<div class="modal-bg" id="authModalBg">
  <div class="modal">
    <h2 id="authTitle">Vendor Log In</h2>
    <input id="authEmail" placeholder="Email" type="email">
    <input id="authPass" placeholder="Password" type="password">
    <p class="status" id="authStatus"></p>
    <button class="btn" id="authSubmit" style="width:100%">Log In</button>
    <p class="switch" id="authSwitch">New vendor? Sign up instead</p>
    <p class="switch" id="authCancel">Cancel</p>
  </div>
</div>

<script>
const SUPABASE_URL = "https://rrxvfjtgutdcnsazydep.supabase.co";
const SUPABASE_KEY = "sb_publishable_OQueaPLqab2fgQ0pLgA02A_JhAoBKGl";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CATS = ["Photography","Entertainment","Bounce Houses","Party Rentals","Bakery","Catering","DJ"];
let vendors = [];
let activeCat = "All";
let session = null;

const gridEl = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const filtersEl = document.getElementById('filters');
const authArea = document.getElementById('authArea');
const myPanel = document.getElementById('myPanel');

// Escape text so nobody can inject HTML into the page
function esc(t){
  return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// Only allow normal http/https links
function safeUrl(u){
  if (!u) return '';
  u = String(u).trim();
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try {
    const x = new URL(u);
    return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : '';
  } catch(e){ return ''; }
}

async function loadVendors(){
  const { data, error } = await sb.from('vendors').select('*');
  vendors = data || [];
  renderFilters(); renderGrid();
}

function renderFilters(){
  const cats = ["All", ...new Set(vendors.map(v=>v.cat))];
  filtersEl.innerHTML = cats.map(c=>`<button class="chip${c===activeCat?' active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  filtersEl.querySelectorAll('.chip').forEach(btn=>{
    btn.onclick = ()=>{ activeCat = btn.dataset.cat; renderFilters(); renderGrid(); };
  });
}

function renderGrid(){
  const list = activeCat==="All" ? vendors : vendors.filter(v=>v.cat===activeCat);
  gridEl.innerHTML = list.map(v => {
    const photo = safeUrl(v.photo_url);
    const site = safeUrl(v.website);
    return `
    <div class="card">
      ${photo ? `<img class="photo" src="${esc(photo)}" alt="${esc(v.name)}" loading="lazy">` : ''}
      <span class="cat">${esc(v.cat)}</span>
      <p class="name">${esc(v.name)}</p>
      <span class="area">${esc(v.area)}</span>
      <span class="rating">${esc(v.rating)}</span>
      ${site ? `<a class="site" href="${esc(site)}" target="_blank" rel="noopener noreferrer">Visit website</a>` : ''}
      ${v.email ? `<a class="mini" href="mailto:${esc(v.email)}">Contact</a>` : ''}
    </div>`;
  }).join('');
  emptyEl.style.display = list.length ? 'none' : 'block';
}

function renderAuthArea(){
  if (session){
    authArea.innerHTML = `<button class="btn ghost" id="logoutBtn">Log Out</button>`;
    document.getElementById('logoutBtn').onclick = async ()=>{
      await sb.auth.signOut(); session = null; renderAuthArea(); renderMyPanel();
    };
  } else {
    authArea.innerHTML = `<button class="btn" id="openAuth">Vendor Log In</button>`;
    document.getElementById('openAuth').onclick = openAuthModal;
  }
}

function renderMyPanel(){
  if (!session){ myPanel.innerHTML = ''; return; }
  const mine = vendors.find(v => v.user_id === session.user.id);
  const currentPhoto = mine ? safeUrl(mine.photo_url) : '';
  myPanel.innerHTML = `
    <div class="panel">
      <h2>${mine ? 'My Listing' : 'Add Your Listing — Free'}</h2>
      <input id="mName" placeholder="Business name" value="${esc(mine ? mine.name : '')}">
      <select id="mCat">${CATS.map(c=>`<option ${mine && mine.cat===c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <input id="mArea" placeholder="Area (e.g. League City)" value="${esc(mine ? mine.area : '')}">
      <input id="mEmail" placeholder="Contact email" value="${esc(mine ? mine.email : '')}">
      <input id="mWebsite" placeholder="Website (optional)" value="${esc(mine ? mine.website : '')}">
      ${currentPhoto ? `<img class="photo" src="${esc(currentPhoto)}" alt="Current photo" style="margin-bottom:8px">` : ''}
      <input id="mPhoto" type="file" accept="image/*">
      <p class="hint">Photo (optional, max 5 MB). Choosing a new one replaces the current photo.</p>
      <p class="status" id="mStatus"></p>
      <div style="display:flex; gap:8px;">
        <button class="btn" id="mSave" style="flex:1">${mine ? 'Save Changes' : 'Add Listing'}</button>
        ${mine ? `<button class="btn ghost" id="mDelete">Delete</button>` : ''}
      </div>
    </div>`;

  document.getElementById('mSave').onclick = async ()=>{
    const name = document.getElementById('mName').value.trim();
    const cat = document.getElementById('mCat').value;
    const area = document.getElementById('mArea').value.trim();
    const email = document.getElementById('mEmail').value.trim();
    const website = document.getElementById('mWebsite').value.trim();
    const file = document.getElementById('mPhoto').files[0];
    const statusEl = document.getElementById('mStatus');

    if (!name || !area || !email){ statusEl.textContent = "Fill in name, area and email."; return; }
    if (website && !safeUrl(website)){ statusEl.textContent = "Enter a valid website link."; return; }
    if (file){
      if (!file.type.startsWith('image/')){ statusEl.textContent = "Photo must be an image."; return; }
      if (file.size > 5 * 1024 * 1024){ statusEl.textContent = "Photo must be under 5 MB."; return; }
    }

    statusEl.textContent = "Saving...";
    const fields = { name, cat, area, email, website: safeUrl(website) };

    if (file){
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
      const path = session.user.id + '/' + Date.now() + '.' + ext;
      const up = await sb.storage.from('vendor-photos').upload(path, file);
      if (up.error){ statusEl.textContent = "Photo upload failed: " + up.error.message; return; }
      fields.photo_url = sb.storage.from('vendor-photos').getPublicUrl(path).data.publicUrl;
    }

    let res;
    if (mine){
      res = await sb.from('vendors').update(fields).eq('user_id', session.user.id);
    } else {
      res = await sb.from('vendors').insert({ ...fields, user_id: session.user.id, rating: "New" });
    }
    if (res.error){ statusEl.textContent = "Error: " + res.error.message; return; }
    statusEl.textContent = "Saved!";
    await loadVendors(); renderMyPanel();
  };

  if (mine){
    document.getElementById('mDelete').onclick = async ()=>{
      if (!confirm("Delete your listing?")) return;
      await sb.from('vendors').delete().eq('user_id', session.user.id);
      await loadVendors(); renderMyPanel();
    };
  }
}

// Login / signup popup
let authMode = 'login';
const authModalBg = document.getElementById('authModalBg');
function openAuthModal(){ authModalBg.classList.add('open'); }
document.getElementById('authCancel').onclick = ()=> authModalBg.classList.remove('open');
document.getElementById('authSwitch').onclick = ()=>{
  authMode = authMode === 'login' ? 'signup' : 'login';
  document.getElementById('authTitle').textContent = authMode==='login' ? 'Vendor Log In' : 'Vendor Sign Up';
  document.getElementById('authSubmit').textContent = authMode==='login' ? 'Log In' : 'Sign Up';
  document.getElementById('authSwitch').textContent = authMode==='login' ? 'New vendor? Sign up instead' : 'Already have an account? Log in';
};
document.getElementById('authSubmit').onclick = async ()=>{
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPass').value;
  const statusEl = document.getElementById('authStatus');
  if (!email || !password){ statusEl.textContent = "Enter email and password."; return; }
  statusEl.textContent = "Working...";
  const result = authMode==='login'
    ? await sb.auth.signInWithPassword({ email, password })
    : await sb.auth.signUp({ email, password });
  if (result.error){ statusEl.textContent = result.error.message; return; }
  session = result.data.session;
  authModalBg.classList.remove('open');
  statusEl.textContent = '';
  renderAuthArea(); renderMyPanel();
};

(async () => {
  const { data } = await sb.auth.getSession();
  session = data.session;
  await loadVendors();
  renderAuthArea();
  renderMyPanel();
})();
</script>
</body>
</html>
